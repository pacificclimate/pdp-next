server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /favicon.ico {
    log_not_found off;
    access_log off;
  }

  location = /runtime-config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }
  location = /pdp-next/runtime-config.js {
    rewrite ^/pdp-next/runtime-config.js$ /runtime-config.js break;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location /portal-meta/ {
    alias /portal-meta/;
    default_type application/json;
    try_files $uri =404;
  }

  location = /pdp-next {
    return 301 /pdp-next/;
  }

  location /pdp-next/ {
    rewrite ^/pdp-next/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
